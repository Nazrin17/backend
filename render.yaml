services:
  - type: web
    name: medico-backend
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medico-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: medico-db
    plan: free
    databaseName: medico
    user: medico_user

